<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FLICKPICK - TV Show Details">
    <title>FLICKPICK - TV Show Details</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <nav>
            <div class="nav-left">
                <h1><a href="/" class="logo-link">FLICKPICK</a></h1>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/mustwatch/">Must Watch Century</a>
                    <a href="/tvshow/">TV Shows</a>
                    <a href="/watchlist/">My List</a>
                </div>
            </div>
            <div class="nav-right">
                <div class="search-bar">
                    <input type="text" placeholder="Search movies & shows...">
                    <i class="fas fa-search"></i>
                </div>
                <div id="navbarAuthArea" style="position:relative; margin-left:auto; display:flex; align-items:center;">
                  <button id="loginBtn" class="login-btn">Login</button>
                  <button id="registerBtn" class="login-btn">Register</button>
                </div>
            </div>
        </nav>
    </header>
    <main id="tvDetailsMain" class="tv-details-page">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading TV show details...</p>
        </div>
    </main>
    <section id="reviewSection" class="review-section">
        <h2>Post a Review</h2>
        <div id="starRating" class="star-rating">
            <span data-value="1" class="star">&#9733;</span>
            <span data-value="2" class="star">&#9733;</span>
            <span data-value="3" class="star">&#9733;</span>
            <span data-value="4" class="star">&#9733;</span>
            <span data-value="5" class="star">&#9733;</span>
        </div>
        <textarea id="reviewText" rows="3" placeholder="Write your review..."></textarea>
        <button id="submitReviewBtn">Submit Review</button>
        <div id="reviewMessage"></div>
        <h3>Reviews</h3>
        <div id="reviewsContainer"></div>
    </section>

    <footer>
        <p>2024 FLICKPICK. All rights reserved.</p>
    </footer>
    <script type="module" src="{% static 'js/config.js' %}"></script>
    <script type="module" src="{% static 'js/auth.js' %}"></script>
    <script type="module" src="{% static 'js/tvdetails.js' %}"></script>
    <script type="module" src="{% static 'js/tvdetails.review.js' %}"></script>
</body>
</html>
